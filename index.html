	<style>

		html, body { min-height:100%; }

		header p { margin:10px 0 0; color:#cbd4da; font-size:12px; line-height:1.55; }
		form { padding:22px; }
		label { display:block; margin-bottom:7px; font:800 11px/1.3 "SFMono-Regular",Consolas,monospace; letter-spacing:.05em; text-transform:uppercase; }
		.field { display:flex; gap:8px; }
		input { min-width:0; flex:1; height:42px; padding:8px 10px; border:1px solid var(--rule); border-radius:2px; background:#fff; color:var(--navy); font:500 15px/1.2 inherit; }
		input:focus { outline:3px solid var(--orange); outline-offset:2px; }
		button { height:42px; padding:0 16px; border:0; border-radius:2px; background:var(--blue); color:#fff; cursor:pointer; font:800 11px/1 "SFMono-Regular",Consolas,monospace; letter-spacing:.05em; }
		button:hover { background:var(--navy); }
		button:disabled { cursor:wait; opacity:.65; }
		.status { min-height:20px; margin:12px 0 0; color:var(--muted); font-size:12px; line-height:1.5; }
		.status.error { color:#a34a48; }
		footer { padding:14px 22px; border-top:1px solid #c5ccc5; color:var(--muted); font-size:11px; line-height:1.5; }
		@media (max-width:520px) { body { padding:12px; } .field { display:grid; } button { width:100%; } h1 { font-size:27px; } }

		const form = document.getElementById("unlock-form");
		const input = document.getElementById("password");
		const button = document.getElementById("unlock");
		const status = document.getElementById("status");
		const lockKey = "mja-password-lock-until";
		let lockTimer;
		const fromBase64 = (value) => Uint8Array.from(atob(value), (character) => character.charCodeAt(0));

		const updateLockout = () => {
			clearTimeout(lockTimer);
			const lockUntil = Number(localStorage.getItem(lockKey) || 0);
			const remaining = lockUntil - Date.now();

			if (remaining > 0) {
				const seconds = Math.ceil(remaining / 1000);
				input.disabled = true;
				button.disabled = true;
				status.className = "status error";
				status.textContent = "密码错误，请在 " + seconds + " 秒后重试。";
				lockTimer = setTimeout(updateLockout, 250);
				return true;
			}

			localStorage.removeItem(lockKey);
			input.disabled = false;
			button.disabled = false;
			if (status.classList.contains("error")) {
				status.className = "status";
				status.textContent = "可以重新输入密码。";
			}
			return false;
		};

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			if (updateLockout()) return;
			button.disabled = true;
			status.className = "status";
			status.textContent = "正在验证并解密…";

			try {
				const material = await crypto.subtle.importKey(

					new TextEncoder().encode(input.value),
					"PBKDF2",

					{ name: "AES-GCM", length: 256 },
					false,
					["decrypt"]
				);
				const clear = await crypto.subtle.decrypt(
					{ name: "AES-GCM", iv: fromBase64(encrypted.iv) },
					key,
					fromBase64(encrypted.payload)
				);
				const html = new TextDecoder().decode(clear);
				document.open("text/html", "replace");
				document.write(html);
				document.close();
			} catch (error) {
				input.value = "";
				localStorage.setItem(lockKey, String(Date.now() + 60_000));
				updateLockout();
			}
